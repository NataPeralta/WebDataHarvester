name: Deploy

on:
  push:
    branches:
      - main
      - claude/github-pages-site-ln6583
  workflow_dispatch:

concurrency:
  group: deploy-programa-semanal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, programa-semanal]
    steps:
      - name: Actualizar checkout y reiniciar stack
        run: |
          set -euo pipefail
          cd /home/nata/programa-semanal
          git fetch --prune origin
          git reset --hard "$GITHUB_SHA"
          docker compose up -d --build --remove-orphans
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8097/api/salud >/dev/null; then
              echo "OK"
              exit 0
            fi
            sleep 1
          done
          echo "No respondió /api/salud"
          docker logs --tail 80 programa-semanal || true
          exit 1
