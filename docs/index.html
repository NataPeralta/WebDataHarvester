<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programas Publicados</title>
  <meta name="description" content="Programas semanales publicados.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Programas Publicados</h1>
    <a class="btn ghost" href="admin.html">Administrar</a>
  </header>

  <main class="galeria-wrap">
    <p id="estado-galeria" class="hint centrado">Cargando…</p>
    <section id="destacado" class="destacado" hidden>
      <h2>Esta semana</h2>
      <div id="destacado-card"></div>
    </section>
    <h2 id="titulo-anteriores" hidden>Todos los programas</h2>
    <div id="galeria" class="galeria"></div>
  </main>

  <dialog id="visor">
    <form method="dialog" class="visor-barra">
      <strong id="visor-titulo"></strong>
      <span class="visor-acciones">
        <a class="btn primary" id="visor-descargar" download>Descargar</a>
        <button class="btn">Cerrar</button>
      </span>
    </form>
    <img id="visor-img" alt="">
  </dialog>

  <script src="config.js"></script>
  <script src="galeria.js"></script>
</body>
</html>
